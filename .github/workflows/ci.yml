name: FreeBiz CI & Android APK Build

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Test & Web Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run automated test suite
        run: npm test

      - name: Run linter and type checks
        run: npm run lint

      - name: Run production web build
        run: npm run build

  build-android-apk:
    name: Build Android APK
    needs: [build-and-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Sync web assets with Capacitor Android
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK was generated
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "SUCCESS: APK generated at $APK_PATH"
            ls -lh "$APK_PATH"
          else
            echo "ERROR: APK file not found at expected path: $APK_PATH"
            find android/app/build/outputs -type f
            exit 1
          fi

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeBiz-QR-Scanner-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: FreeBiz QR Scanner ${{ github.ref_name }}
          body: |
            ## FreeBiz QR Scanner — Release ${{ github.ref_name }}
            
            - 100% Client-Side QR Generator and Live Camera / Image QR Scanner.
            - Professional branding with dark navy & cyan viewfinder interface.
            - Clean permissions: Camera permission for scanner, zero intrusive permissions.
            - Compatible with Android 8.0+ (API 26+).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
